<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - DevBrain-Ai</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div id="canvas-container"></div>

    <!-- Back Button -->
    <a href="/" class="back-btn">
        <i data-lucide="arrow-left"></i>
        Back to Home
    </a>

    <main>
        <section class="contact-page">
            <div class="container">
                <div class="contact-content">
                    <h1>Contact Us</h1>
                    <div class="contact-details">
                        <div class="contact-item">
                            <h3>Name</h3>
                            <p>Peela Gagan Varshit</p>
                        </div>
                        <div class="contact-item">
                            <h3>Email</h3>
                            <p><a href="mailto:peelavarshit@gmail.com">peelavarshit@gmail.com</a></p>
                        </div>
                        <div class="contact-item">
                            <h3>Location</h3>
                            <p>Bhimavaram, Andhra Pradesh</p>
                        </div>
                        <div class="contact-item">
                            <h3>Find Us on Google Maps</h3>
                            <a href="https://www.google.com/maps/place/Bhimavaram,+Andhra+Pradesh,+India" target="_blank" class="maps-link">
                                <i data-lucide="map-pin"></i>
                                View on Google Maps
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="js/main.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
