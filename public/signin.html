<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - DevBrain-Ai</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <!-- Back Button -->
    <a href="/" class="back-btn">
        <i data-lucide="arrow-left"></i>
        Back to Home
    </a>

    <div class="auth-container">
        <div class="auth-box">
            <h2 class="auth-title">Welcome Back</h2>
            <form id="signin-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="dev@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary auth-btn">Sign In</button>
            </form>
            <div class="auth-footer">
                Don't have an account? <a href="/signup">Sign Up</a>
            </div>
            <div style="text-align: center; margin-top: 1rem;">
                <a href="/" style="font-size: 0.8rem; color: #a1a1aa;">← Back to Home</a>
            </div>
        </div>
    </div>
    <script src="js/main.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
